<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Maria App Studio mark: five bars forming an "M" (also reads as a workload chart); center bar in signal amber.
       Hairline-framed at favicon scale, byte-for-byte the artwork the approved concept page carried as a data URI. -->
  <rect x="1" y="1" width="46" height="46" rx="10" fill="#14110E" stroke="#6F6355" stroke-width="2"/>
  <g fill="#EFE9DE">
    <rect x="9" y="13" width="3" height="24" rx="1.5"/>
    <rect x="15.75" y="19" width="3" height="18" rx="1.5"/>
    <rect x="29.25" y="19" width="3" height="18" rx="1.5"/>
    <rect x="36" y="13" width="3" height="24" rx="1.5"/>
  </g>
  <rect x="22.5" y="25" width="3" height="12" rx="1.5" fill="#F0A83C"/>
</svg>
